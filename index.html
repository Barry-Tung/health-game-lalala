<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跳跳跳健康問答</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #172313;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #fff;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px;
    }
    .toolbar {
      width: min(1280px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hud, .btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.18);
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 700;
      backdrop-filter: blur(6px);
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 11px 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .start { background: #77d84a; color: #18300d; }
    .restart { background: #fff; color: #1c2e12; }
    .stage {
      position: relative;
      width: min(1280px, 100%);
      background: #24341d;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      border: 3px solid rgba(255,255,255,0.08);
    }
    .win-restart {
      position: absolute;
      left: 50%;
      top: 73%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 10;
      background: linear-gradient(180deg, #ffe66d, #ffb703);
      color: #3a2600;
      border: 4px solid rgba(255,255,255,0.95);
      box-shadow: 0 10px 24px rgba(0,0,0,0.32);
      padding: 14px 34px;
      font-size: 1.15rem;
      border-radius: 999px;
    }
    .win-restart.show { display: block; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(#7fc8d0, #c8dfaa 45%, #436e35 100%);
    }
    .note {
      width: min(1280px, 100%);
      color: rgba(255,255,255,0.84);
      line-height: 1.7;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="hud">
        <div class="pill" id="scoreText">分數：0</div>
        <div class="pill" id="lifeText">生命：3</div>
        <div class="pill" id="levelText">題目：1 / 10</div>
      </div>
      <div class="btns">
        <button class="start" id="startBtn">開始遊戲</button>
        <button class="restart" id="restartBtn">重新開始</button>
      </div>
    </div>

    <div class="stage">
      <canvas id="gameCanvas" width="1280" height="820"></canvas>
      <button class="win-restart" id="winRestartBtn">重新開始</button>
    </div>

    <div class="note">
      操作：A / D 或 ← / → 移動，W / ↑ / 空白鍵跳躍。從地面跳起來碰撞正確答案，答案箱會消失並開出通道；答錯或頂到磚塊不會有反應。
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const lifeText = document.getElementById('lifeText');
    const levelText = document.getElementById('levelText');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const winRestartBtn = document.getElementById('winRestartBtn');

    const W = canvas.width;
    const H = canvas.height;
    const keys = {};

    const BRICK_W = 46;
    const BRICK_H = 36;
    const BOX_W = 82;
    const BOX_H = 74;

    const groundY = 742;
    // v2.1 位置修正版：這次把答案牆明顯下移到角色跳得到的位置。
    // 答案箱底部約在 626px；角色站在地面時頭頂約在 684px，正常跳躍可碰到。
    const gateY = 570;
    const upperPlatformY = 500;

    const player = {
      x: 610,
      y: groundY - 58,
      w: 38,
      h: 58,
      vx: 0,
      vy: 0,
      speed: 5.2,
      jump: 18.6,
      onGround: false,
      face: 1
    };

    const levels = [
      {
        question: '第 1 題：一般成人每週建議至少多少中等強度身體活動？',
        correct: 1,
        options: ['30 分鐘', '150 分鐘', '60 分鐘', '300 分鐘'],
        explain: '成人每週建議至少 150 分鐘中等強度身體活動。'
      },
      {
        question: '第 2 題：多數成人每日建議睡眠時間最接近哪一項？',
        correct: 2,
        options: ['5 小時', '11 小時', '7–9 小時', '3 小時'],
        explain: '多數成人建議每日睡眠 7–9 小時。'
      },
      {
        question: '第 3 題：哪一項較有助於預防高血壓？',
        correct: 0,
        options: ['減少鈉攝取', '高鹽飲食', '長期熬夜', '含糖飲料'],
        explain: '減少鈉攝取有助於血壓控制。'
      },
      {
        question: '第 4 題：下列哪一項較符合健康飲食？',
        correct: 3,
        options: ['常吃炸物', '每天宵夜', '含糖飲料', '蔬果全穀'],
        explain: '蔬果與全穀類富含營養。'
      },
      {
        question: '第 5 題：每日建議飲水量最接近哪一項？',
        correct: 1,
        options: ['500 ml', '1500–2000 ml', '300 ml', '4000 ml'],
        explain: '一般成人每日建議約 1500–2000 ml。'
      },
      {
        question: '第 6 題：哪種行為有助於心理健康？',
        correct: 2,
        options: ['長時間滑手機', '熬夜追劇', '規律運動', '過度工作'],
        explain: '規律運動有助於減壓與情緒調節。'
      },
      {
        question: '第 7 題：預防流感最有效的方法之一是？',
        correct: 0,
        options: ['接種疫苗', '喝可樂', '熬夜', '少洗手'],
        explain: '接種疫苗能有效預防流感。'
      },
      {
        question: '第 8 題：哪一項屬於良好的飲食習慣？',
        correct: 1,
        options: ['暴飲暴食', '定時定量', '只吃零食', '跳過早餐'],
        explain: '定時定量有助於維持健康。'
      },
      {
        question: '第 9 題：久坐族建議多久起身活動一次？',
        correct: 2,
        options: ['3 小時', '不用活動', '30–60 分鐘', '一天一次'],
        explain: '每 30–60 分鐘起身活動較健康。'
      },
      {
        question: '第 10 題：哪一項有助於維持心血管健康？',
        correct: 3,
        options: ['高油飲食', '抽菸', '缺乏運動', '規律運動'],
        explain: '規律運動有助於心血管健康。'
      }
    ];

    let running = false;
    let finished = false;
    let currentLevel = 0;
    let score = 0;
    let lives = 3;
    let gateOpened = false;
    let transitionTimer = 0;
    let popup = '';
    let popupTimer = 0;
    let coinVisible = false;
    let coinCollected = false;
    let attempts = 0;
    let correctAnswers = 0;
    let wrongAnswers = 0;
    let bestScore = Number(localStorage.getItem('healthGameBestScore') || 0);
    const wrongBoxShake = {}; // 記錄錯誤答案箱晃動時間，key = 答案索引
    const particles = []; // 金幣與答對特效粒子

    const coinImage = new Image();
    coinImage.src = './coin.png'; // 可選：若同資料夾放 coin.png，會使用圖片；否則使用程式畫的金幣
    let coinImageLoaded = false;
    coinImage.onload = () => { coinImageLoaded = true; };

    let audioCtx = null;
    function playTone(freq = 440, duration = 0.08, type = 'sine', volume = 0.08) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playJumpSound() { playTone(260, 0.07, 'square', 0.045); }
    function playWrongSound() { playTone(140, 0.12, 'sawtooth', 0.06); }
    function playCorrectSound() {
      playTone(520, 0.08, 'sine', 0.06);
      setTimeout(() => playTone(760, 0.08, 'sine', 0.055), 70);
    }
    function playCoinSound() {
      playTone(880, 0.07, 'triangle', 0.06);
      setTimeout(() => playTone(1180, 0.08, 'triangle', 0.055), 60);
    }

    function answerBoxes() {
      const startX = 165;
      const gap = 142;
      return levels[currentLevel].options.map((text, i) => ({
        x: startX + i * (BOX_W + gap),
        y: gateY - 18,
        w: BOX_W,
        h: BOX_H,
        text,
        idx: i,
        removed: gateOpened && i === levels[currentLevel].correct
      }));
    }

    function startGame() {
      winRestartBtn.classList.remove('show');
      running = true;
      finished = false;
      currentLevel = 0;
      score = 0;
      lives = 3;
      gateOpened = false;
      transitionTimer = 0;
      coinVisible = false;
      coinCollected = false;
      attempts = 0;
      correctAnswers = 0;
      wrongAnswers = 0;
      particles.length = 0;
      Object.keys(wrongBoxShake).forEach(key => delete wrongBoxShake[key]);
      setPlayerToGround();
      setPopup('頂到正確答案箱，箱子會消失並開通往上一層的路。', 180);
      updateHud();
    }

    function setPlayerToGround() {
      player.x = 610;
      player.y = groundY - player.h;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
    }

    function updateHud() {
      scoreText.textContent = `分數：${score}`;
      lifeText.textContent = `生命：${lives}`;
      levelText.textContent = `題目：${Math.min(currentLevel + 1, levels.length)} / ${levels.length}`;
    }

    function setPopup(text, frames = 120) {
      popup = text;
      popupTimer = frames;
    }

    function jump() {
      if (!running || finished || transitionTimer > 0) return;
      if (player.onGround) {
        player.vy = -player.jump;
        player.onGround = false;
        playJumpSound();
      }
    }

    function isCorrectBox(box) {
      return box.idx === levels[currentLevel].correct;
    }

    function openGate(box) {
      gateOpened = true;
      coinVisible = true;
      coinCollected = false;
      attempts += 1;
      correctAnswers += 1;
      score += 10;
      updateHud();
      setPopup(`答對了！${levels[currentLevel].explain} 請撿取金幣進入下一題。`, 180);
      playCorrectSound();
      spawnParticles(box.x + box.w / 2, box.y + box.h / 2, '#89ff4d', 18);
      // 答對後答案箱消失，角色會被往上帶一段，方便穿過通道跳到上層平台。
      player.y = box.y + box.h + 2;
      player.vy = -17.2;
    }

    function coinRect() {
      return {
        x: 610,
        y: upperPlatformY - 62,
        w: 46,
        h: 46
      };
    }

    function collectCoin() {
      if (!coinVisible || coinCollected) return;
      coinCollected = true;
      coinVisible = false;
      score += 5;
      updateHud();
      setPopup('獲得金幣！準備進入下一題。', 80);
      playCoinSound();
      const c = coinRect();
      spawnParticles(c.x + c.w / 2, c.y + c.h / 2, '#ffd83d', 26);
      transitionTimer = 45;
    }

    function triggerWrongBoxFeedback(box) {
      wrongBoxShake[box.idx] = 24;
      attempts += 1;
      wrongAnswers += 1;
      playWrongSound();
      setPopup('這不是正確答案，請再試一次。', 55);
    }

    function updateWrongBoxShake() {
      for (const key of Object.keys(wrongBoxShake)) {
        wrongBoxShake[key] -= 1;
        if (wrongBoxShake[key] <= 0) delete wrongBoxShake[key];
      }
    }

    function spawnParticles(x, y, color = '#ffd83d', count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4.2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.8,
          life: 38 + Math.random() * 22,
          size: 3 + Math.random() * 5,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.16;
        p.life -= 1;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function nextLevel() {
      currentLevel += 1;
      if (currentLevel >= levels.length) {
        finished = true;
        bestScore = Math.max(bestScore, score);
        localStorage.setItem('healthGameBestScore', String(bestScore));
        setPopup('恭喜！你已收集到所有金幣，挑戰成功！', 99999);
        winRestartBtn.classList.add('show');
        updateHud();
        return;
      }
      gateOpened = false;
      transitionTimer = 0;
      coinVisible = false;
      coinCollected = false;
      Object.keys(wrongBoxShake).forEach(key => delete wrongBoxShake[key]);
      setPlayerToGround();
      setPopup('進入下一題。請碰撞出正確答案。', 150);
      updateHud();
    }

    function rectsIntersect(a, b) {
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }

    function getBarrierRects() {
      const rects = [];
      const boxes = answerBoxes();
      const correctIdx = levels[currentLevel].correct;
      const correctBox = boxes[correctIdx];
      const openGap = gateOpened
        ? { x: correctBox.x - 8, y: gateY - 6, w: correctBox.w + 16, h: BOX_H + 24 }
        : null;

      // 答案箱本身也是障礙物；只有正確答案箱在答對後會消失。
      for (const box of boxes) {
        if (!box.removed) {
          rects.push({ ...box, type: box.idx === correctIdx ? 'correctBox' : 'wrongBox' });
        }
      }

      // 磚牆改成完整連續的一整排，避免答案箱之間出現漏洞。
      // 視覺上答案箱會蓋在磚牆上；答對後只在正確答案箱的位置打開通道。
      for (let x = 0; x < W; x += BRICK_W) {
        const brick = { x, y: gateY, w: BRICK_W, h: BRICK_H, type: 'brick' };
        const insideOpenedGap = openGap && rectsIntersect(brick, openGap);
        if (!insideOpenedGap) rects.push(brick);
      }

      return rects;
    }

    function resolveBarrierCollision(prev) {
      const solids = getBarrierRects();
      for (const solid of solids) {
        if (!rectsIntersect(player, solid)) continue;

        const prevBottom = prev.y + player.h;
        const prevTop = prev.y;
        const prevRight = prev.x + player.w;
        const prevLeft = prev.x;

        // 從下方往上頂到障礙物：
        // 1. 正確答案箱：消失並開通道
        // 2. 錯誤答案箱或磚牆：像撞到天花板一樣彈回，不能穿越
        if (prevTop >= solid.y + solid.h - 2 && player.vy < 0) {
          player.y = solid.y + solid.h + 0.5;
          if (solid.type === 'correctBox' && !gateOpened) {
            openGate(solid);
          } else {
            if (solid.type === 'wrongBox') triggerWrongBoxFeedback(solid);
            player.vy = 2.8;
          }
          return;
        }

        // 從上方落到障礙物，可站在磚塊或錯誤答案箱上，但不能穿過去。
        if (prevBottom <= solid.y + 2 && player.vy >= 0) {
          player.y = solid.y - player.h;
          player.vy = 0;
          player.onGround = true;
          return;
        }

        // 左右撞到障礙物時擋住，避免側邊穿牆。
        if (prevRight <= solid.x + 2) {
          player.x = solid.x - player.w;
          player.vx = 0;
          return;
        }
        if (prevLeft >= solid.x + solid.w - 2) {
          player.x = solid.x + solid.w;
          player.vx = 0;
          return;
        }
      }
    }

    function update() {
      if (!running) {
        if (popupTimer > 0) popupTimer--;
        return;
      }
      if (finished) {
        if (popupTimer > 0) popupTimer--;
        return;
      }

      if (transitionTimer > 0) {
        transitionTimer--;
        updateWrongBoxShake();
        updateParticles();
        if (transitionTimer === 0) nextLevel();
        return;
      }

      if (keys.ArrowLeft || keys.a || keys.A) {
        player.vx = -player.speed;
        player.face = -1;
      } else if (keys.ArrowRight || keys.d || keys.D) {
        player.vx = player.speed;
        player.face = 1;
      } else {
        player.vx *= 0.76;
        if (Math.abs(player.vx) < 0.12) player.vx = 0;
      }

      player.vy += 0.58;
      if (player.vy > 14) player.vy = 14;

      const prev = { x: player.x, y: player.y };
      const prevBottom = player.y + player.h;

      player.x += player.vx;
      player.y += player.vy;

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > W) player.x = W - player.w;

      player.onGround = false;

      // 地面碰撞
      if (prevBottom <= groundY && player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.onGround = true;
      }

      // 答案箱與磚牆碰撞：正確箱消失；錯誤箱與牆會阻擋角色。
      resolveBarrierCollision(prev);

      // 上層平台：只有答對開門後才允許站上去。站上去後不直接換題，必須吃到金幣才進入下一題。
      if (gateOpened && prevBottom <= upperPlatformY && player.y + player.h >= upperPlatformY) {
        player.y = upperPlatformY - player.h;
        player.vy = 0;
        player.onGround = true;
      }

      // 金幣獎賞：答對後出現在上層平台，角色碰到金幣後才進入下一題。
      if (coinVisible && rectsIntersect(player, coinRect())) {
        collectCoin();
      }

      if (popupTimer > 0) popupTimer--;
      updateWrongBoxShake();
      updateParticles();
    }

    const bgImage = new Image();
bgImage.src = "./background.png"; // 請把你的圖片命名為 background.png 並放同資料夾
let bgLoaded = false;

bgImage.onload = () => {
  bgLoaded = true;
};

function drawBackground() {
  if (bgLoaded) {
    ctx.drawImage(bgImage, 0, 0, W, H);
  } else {
    // fallback（避免 drawImage error）
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, '#73cdd7');
    gradient.addColorStop(1, '#334c25');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
  }
}

    function drawSun(x, y) {
      const g = ctx.createRadialGradient(x, y, 10, x, y, 150);
      g.addColorStop(0, 'rgba(255,255,190,0.85)');
      g.addColorStop(1, 'rgba(255,255,190,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, 150, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCloud(x, y, s) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s, s);
      ctx.fillStyle = 'rgba(255,255,255,0.26)';
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, Math.PI * 2);
      ctx.arc(34, -8, 24, 0, Math.PI * 2);
      ctx.arc(68, 2, 31, 0, Math.PI * 2);
      ctx.arc(34, 14, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawHill(x, y, w, h, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      ctx.quadraticCurveTo(x + w * 0.2, y, x + w * 0.5, y + h * 0.22);
      ctx.quadraticCurveTo(x + w * 0.72, y + h * 0.38, x + w, y + h);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawTree(x, baseY, s) {
      ctx.save();
      ctx.translate(x, baseY);
      ctx.scale(s, s);
      ctx.fillStyle = '#5f351c';
      ctx.fillRect(0, -145, 36, 145);
      ctx.beginPath();
      ctx.moveTo(18, -95);
      ctx.quadraticCurveTo(75, -122, 92, -170);
      ctx.lineTo(103, -160);
      ctx.quadraticCurveTo(68, -105, 28, -84);
      ctx.fill();
      ctx.fillStyle = '#2f5a22';
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.arc(-48 + i * 24, -170 - (i % 2) * 10, 42, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#456f25';
      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.arc(-32 + i * 23, -200 - (i % 2) * 8, 36, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawGrass(y) {
      ctx.fillStyle = '#547a35';
      ctx.fillRect(0, y, W, H - y);
      ctx.fillStyle = '#6fa44a';
      for (let x = 0; x < W; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 8, y - 14 - (x % 5));
        ctx.lineTo(x + 16, y);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(30,45,20,0.42)';
      for (let x = 0; x < W; x += 85) ctx.fillRect(x, y + 28, 48, 5);
    }

    function drawVersionLabel() {
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.82)';
      ctx.font = 'bold 16px "Microsoft JhengHei"';
      ctx.textAlign = 'right';
      ctx.fillText('v2.1 位置修正版：答案牆已下移', W - 24, 32);
      ctx.restore();
    }

    function drawQuestion() {
      const lv = levels[currentLevel] || levels[levels.length - 1];
      ctx.save();
      ctx.font = 'bold 30px "Microsoft JhengHei"';
      ctx.textAlign = 'left';
      ctx.lineWidth = 7;
      ctx.strokeStyle = 'rgba(22,36,16,0.78)';
      ctx.strokeText(lv.question, 70, 80);
      ctx.fillStyle = '#fff';
      ctx.fillText(lv.question, 70, 80);
      ctx.restore();
    }

    function drawBrick(x, y, w = BRICK_W, h = BRICK_H) {
      ctx.fillStyle = '#7b3d1f';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#a2532b';
      ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
      ctx.strokeStyle = '#4c230f';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(x + 5, y + 5, w - 10, 5);
    }

    function drawBrickLineExceptGate() {
      const boxes = answerBoxes();
      const correctBox = boxes[levels[currentLevel].correct];
      const openGap = gateOpened
        ? { x: correctBox.x - 8, y: gateY - 6, w: correctBox.w + 16, h: BOX_H + 24 }
        : null;

      // 先畫完整、整齊、連續的一整排磚牆。
      // 答案箱會再畫在磚牆上方，因此看起來就是「答案箱夾在磚塊中」。
      for (let x = 0; x < W; x += BRICK_W) {
        const brick = { x, y: gateY, w: BRICK_W, h: BRICK_H };
        const insideOpenedGap = openGap && rectsIntersect(brick, openGap);
        if (!insideOpenedGap) drawBrick(x, gateY, BRICK_W, BRICK_H);
      }
    }

    function drawUpperPlatform() {
      for (let x = 0; x < W; x += BRICK_W) drawBrick(x, upperPlatformY, BRICK_W, BRICK_H);
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(0, upperPlatformY - 3, W, 3);
    }

    function drawGroundPlatform() {
      for (let x = 0; x < W; x += BRICK_W) drawBrick(x, groundY, BRICK_W, BRICK_H);
    }

    function drawAnswerBox(box) {
      if (box.removed) return;
      const shakeFrames = wrongBoxShake[box.idx] || 0;
      const shakeOffset = shakeFrames > 0 ? Math.sin(shakeFrames * 1.15) * 8 : 0;
      const yBump = shakeFrames > 0 ? Math.sin(shakeFrames * 0.8) * 2 : 0;
      const drawX = box.x + shakeOffset;
      const drawY = box.y + yBump;
      ctx.save();
      if (shakeFrames > 0) {
        ctx.shadowColor = 'rgba(255, 40, 40, 0.65)';
        ctx.shadowBlur = 14;
      }
      ctx.fillStyle = '#5bc92f';
      ctx.fillRect(drawX, drawY, box.w, box.h);
      ctx.fillStyle = shakeFrames > 0 ? '#7df047' : '#83ee4b';
      ctx.fillRect(drawX + 5, drawY + 5, box.w - 10, box.h - 10);
      ctx.strokeStyle = shakeFrames > 0 ? '#d62828' : '#2e7019';
      ctx.lineWidth = 4;
      ctx.strokeRect(drawX, drawY, box.w, box.h);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(drawX + 10, drawY + 10, box.w - 20, 12);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 19px "Microsoft JhengHei"';
      wrapCenter(box.text, drawX + box.w / 2, drawY + 36, box.w - 10, 21);
      ctx.restore();
    }

    function drawCoin() {
      if (!coinVisible) return;
      const c = coinRect();
      const pulse = Math.sin(Date.now() / 120) * 3;
      const size = c.w + pulse;
      const x = c.x + c.w / 2 - size / 2;
      const y = c.y + c.h / 2 - size / 2;

      if (coinImageLoaded) {
        ctx.drawImage(coinImage, x, y, size, size);
        return;
      }

      ctx.save();
      const cx = c.x + c.w / 2;
      const cy = c.y + c.h / 2;
      ctx.fillStyle = '#ffd83d';
      ctx.beginPath();
      ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b56b00';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fillStyle = '#fff4a3';
      ctx.beginPath();
      ctx.arc(cx - 9, cy - 10, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e19a00';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, size / 2 - 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#d98400';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('$', cx, cy + 8);
      ctx.restore();
    }

    function drawParticles() {
      ctx.save();
      for (const p of particles) {
        ctx.globalAlpha = Math.max(p.life / 55, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function wrapCenter(text, x, y, maxWidth, lineHeight) {
      const chars = [...text];
      let line = '';
      const lines = [];
      for (const ch of chars) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = ch;
        } else line = test;
      }
      if (line) lines.push(line);
      lines.slice(0, 2).forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.fillStyle = '#d93228';
      ctx.beginPath();
      ctx.ellipse(19, 13, 17, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe0c2';
      ctx.beginPath();
      ctx.arc(21, 25, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#244f9a';
      ctx.fillRect(8, 34, 26, 18);
      ctx.fillRect(6, 50, 10, 8);
      ctx.fillRect(24, 50, 10, 8);
      ctx.fillStyle = '#6a3a1f';
      ctx.fillRect(7, 56, 12, 4);
      ctx.fillRect(23, 56, 12, 4);
      ctx.fillStyle = '#fff';
      ctx.fillRect(player.face === 1 ? 25 : 15, 23, 3, 3);
      ctx.restore();
    }

    function drawPopup() {
      if (!popup || popupTimer <= 0) return;
      ctx.save();
      ctx.globalAlpha = Math.min(1, popupTimer / 20);
      ctx.fillStyle = 'rgba(20,28,18,0.74)';
      ctx.fillRect(150, 110, 980, 62);
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.strokeRect(150, 110, 980, 62);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 24px "Microsoft JhengHei"';
      ctx.fillText(popup, W / 2, 150);
      ctx.restore();
    }

    function drawFinalCoins(centerX, y) {
      ctx.save();
      for (let i = 0; i < 10; i++) {
        const x = centerX - 225 + i * 50;
        const bounce = Math.sin(Date.now() / 180 + i * 0.6) * 4;
        ctx.fillStyle = '#ffd83d';
        ctx.beginPath();
        ctx.arc(x, y + bounce, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#b56b00';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = '#fff4a3';
        ctx.beginPath();
        ctx.arc(x - 6, y - 7 + bounce, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawBigPrizeCoin(x, y) {
      const pulse = Math.sin(Date.now() / 180) * 5;
      const r = 54 + pulse;
      ctx.save();
      ctx.fillStyle = '#ffd83d';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#a65f00';
      ctx.lineWidth = 8;
      ctx.stroke();
      ctx.strokeStyle = '#e9a800';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(x, y, r - 18, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#fff4a3';
      ctx.beginPath();
      ctx.arc(x - 18, y - 22, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#b56b00';
      ctx.font = 'bold 54px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('$', x, y + 19);
      ctx.restore();
    }

    function drawOverlay() {
      if (running && !finished) return;
      ctx.save();

      if (finished && lives > 0) {
        // 第 10 題完成後的專屬遊戲結束畫面
        ctx.fillStyle = 'rgba(7, 18, 8, 0.68)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(255, 255, 245, 0.97)';
        ctx.fillRect(210, 120, 860, 540);
        ctx.strokeStyle = '#ffd83d';
        ctx.lineWidth = 8;
        ctx.strokeRect(210, 120, 860, 540);
        ctx.strokeStyle = '#78c952';
        ctx.lineWidth = 4;
        ctx.strokeRect(230, 140, 820, 500);

        drawBigPrizeCoin(W / 2, 225);

        ctx.fillStyle = '#24431a';
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px "Microsoft JhengHei"';
        ctx.fillText('恭喜！收集完成', W / 2, 330);

        ctx.font = 'bold 28px "Microsoft JhengHei"';
        ctx.fillText('你已成功收集到全部 10 枚健康金幣！', W / 2, 380);

        ctx.font = '24px "Microsoft JhengHei"';
        ctx.fillText(`最終分數：${score}　最佳分數：${bestScore}`, W / 2, 425);

        const accuracy = attempts === 0 ? 100 : Math.round((correctAnswers / attempts) * 100);
        ctx.fillText(`答對率：${accuracy}%（正確 ${correctAnswers} 次／嘗試 ${attempts} 次）`, W / 2, 462);

        drawFinalCoins(W / 2, 520);

        ctx.font = '22px "Microsoft JhengHei"';
        ctx.fillText('按下方「重新開始」可再次挑戰', W / 2, 595);
        ctx.restore();
        return;
      }

      // 初始畫面或失敗畫面
      ctx.fillStyle = 'rgba(10,16,8,0.52)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.94)';
      ctx.fillRect(260, 255, 760, 230);
      ctx.strokeStyle = '#78c952';
      ctx.lineWidth = 5;
      ctx.strokeRect(260, 255, 760, 230);
      ctx.fillStyle = '#24431a';
      ctx.textAlign = 'center';
      ctx.font = 'bold 40px "Microsoft JhengHei"';
      ctx.fillText(finished ? '遊戲結束' : '跳跳跳健康問答', W / 2, 330);
      ctx.font = '24px "Microsoft JhengHei"';
      ctx.fillText(finished ? `最終分數：${score}` : '碰撞正確答案，消除箱子並跳上下一層', W / 2, 378);
      ctx.fillText(finished ? '按重新開始可再次挑戰' : '按上方「開始遊戲」開始', W / 2, 420);
      ctx.restore();
    }

    function draw() {
      drawBackground();
      drawVersionLabel();
      drawQuestion();
      drawUpperPlatform();
      drawBrickLineExceptGate();
      answerBoxes().forEach(drawAnswerBox);
      drawUpperPlatform();
      drawCoin();
      drawParticles();
      drawGroundPlatform();
      if (running) drawPlayer();
      drawPopup();
      drawOverlay();
    }

    function runSanityChecks() {
      console.assert(levels.length === 10, '應有 10 題');
      console.assert(answerBoxes().length === 4, '每題應有 4 個答案箱');
      console.assert(W % BRICK_W !== 1, '磚牆會由 drawBrickLineExceptGate 連續補滿整個畫面寬度');
      console.assert(groundY > gateY, '地面應在答案牆下方');
      console.assert(upperPlatformY < gateY, '上層平台應在答案牆上方');
      const maxJumpHeight = (player.jump * player.jump) / (2 * 0.58);
      const playerTopAtGround = groundY - player.h;
      const reachableHeadY = playerTopAtGround - maxJumpHeight;
      const boxBottomY = gateY - 18 + BOX_H;
      console.assert(reachableHeadY <= boxBottomY, '角色跳躍高度必須能碰到答案箱底部');
      console.assert(reachableHeadY + player.h <= upperPlatformY, '角色跳躍高度必須足以到達上層平台');
      console.log('v2.1 position check', { groundY, gateY, upperPlatformY, boxBottomY, playerTopAtGround, reachableHeadY, jump: player.jump });
      console.assert(levels.every(l => l.correct >= 0 && l.correct < l.options.length), '所有正確答案索引需有效');
      const c = coinRect();
      console.assert(c.y + c.h <= upperPlatformY, '金幣應該放在上層平台上方');
      console.assert(typeof triggerWrongBoxFeedback === 'function', '錯誤答案箱應有晃動反饋函式');
      console.assert(typeof playCoinSound === 'function', '應有金幣音效函式');
      console.assert(typeof spawnParticles === 'function', '應有粒子特效函式');
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (['ArrowUp', ' ', 'w', 'W'].includes(e.key)) {
        e.preventDefault();
        jump();
      }
    });

    document.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
    winRestartBtn.addEventListener('click', startGame);

    updateHud();
    runSanityChecks();
    loop();
  </script>
</body>
</html>
