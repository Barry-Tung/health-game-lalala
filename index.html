<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跳跳跳健康問答</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #172313;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #fff;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px;
    }
    .toolbar {
      width: min(1280px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hud, .btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.18);
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 700;
      backdrop-filter: blur(6px);
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 11px 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .start { background: #77d84a; color: #18300d; }
    .restart { background: #fff; color: #1c2e12; }
    .stage {
      position: relative;
      width: min(1280px, 100%);
      background: #24341d;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      border: 3px solid rgba(255,255,255,0.08);
    }
    .win-restart {
      position: absolute;
      left: 50%;
      top: 73%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 10;
      background: linear-gradient(180deg, #ffe66d, #ffb703);
      color: #3a2600;
      border: 4px solid rgba(255,255,255,0.95);
      box-shadow: 0 10px 24px rgba(0,0,0,0.32);
      padding: 14px 34px;
      font-size: 1.15rem;
      border-radius: 999px;
    }
    .win-restart.show { display: block; }
    
    /* 商店介面樣式 */
    .shop-modal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 35, 20, 0.95);
      border: 4px solid #78c952;
      border-radius: 16px;
      padding: 30px;
      width: 480px;
      text-align: center;
      z-index: 20;
      display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .shop-modal.show { display: block; }
    .shop-modal h2 { margin-top: 0; color: #ffd83d; }
    .shop-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .shop-btn {
      background: #2b4a24;
      color: #fff;
      border: 2px solid #4a803a;
      transition: background 0.2s;
    }
    .shop-btn:hover { background: #3a6331; }
    .shop-btn:disabled { background: #555; border-color: #444; color: #888; cursor: not-allowed; }
    .close-shop {
      background: #ffd83d;
      color: #3a2600;
      width: 100%;
      margin-top: 10px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(#7fc8d0, #c8dfaa 45%, #436e35 100%);
    }
    .note {
      width: min(1280px, 100%);
      color: rgba(255,255,255,0.84);
      line-height: 1.7;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="hud">
        <div class="pill" id="scoreText">分數：0</div>
        <div class="pill" id="coinText">金幣：0</div>
        <div class="pill" id="lifeText">生命：3</div>
        <div class="pill" id="levelText">題目：1 / 20</div>
      </div>
      <div class="btns">
        <button class="start" id="startBtn">開始遊戲</button>
        <button class="restart" id="restartBtn">重新開始</button>
      </div>
    </div>

    <div class="stage">
      <canvas id="gameCanvas" width="1280" height="820"></canvas>
      <button class="win-restart" id="winRestartBtn">重新開始</button>
      
      <!-- 商店介面 -->
      <div id="shopModal" class="shop-modal">
        <h2>中場休息：健康補給站</h2>
        <p style="font-size:1.2rem;">累計持有金幣：<strong id="shopCoinsDisplay" style="color:#ffd83d;">0</strong></p>
        <div class="shop-items">
          <button class="shop-btn" id="buySkinBtn">購買：藍色服裝 (3 金幣)</button>
          <button class="shop-btn" id="buyShieldBtn">購買：一次性防護罩 (2 金幣)</button>
          <button class="shop-btn" id="buySprintShoesBtn">購買：衝刺跑鞋 (4 金幣)</button>
          <button class="shop-btn" id="buyTrailBtn">購買：炫彩殘影 (5 金幣)</button>
        </div>
        <button class="close-shop" id="closeShopBtn">離開商店，繼續挑戰</button>
      </div>
    </div>

    <div class="note">
      操作：A / D 或 ← / → 移動，W / ↑ / 空白鍵跳躍。碰撞正確答案開通道路，第 7、12 與 17 題結束後將開啟道具商店。連續答對 10 題有額外驚喜！
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const coinText = document.getElementById('coinText');
    const lifeText = document.getElementById('lifeText');
    const levelText = document.getElementById('levelText');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const winRestartBtn = document.getElementById('winRestartBtn');
    
    // 商店 DOM 元素
    const shopModal = document.getElementById('shopModal');
    const shopCoinsDisplay = document.getElementById('shopCoinsDisplay');
    const buySkinBtn = document.getElementById('buySkinBtn');
    const buyShieldBtn = document.getElementById('buyShieldBtn');
    const buySprintShoesBtn = document.getElementById('buySprintShoesBtn');
    const buyTrailBtn = document.getElementById('buyTrailBtn'); 
    const closeShopBtn = document.getElementById('closeShopBtn');

    const W = canvas.width;
    const H = canvas.height;
    const keys = {};

    const BRICK_W = 46;
    const BRICK_H = 36;
    const BOX_W = 82;
    const BOX_H = 74;

    const groundY = 742;
    const gateY = 570;
    const upperPlatformY = 500;

    // 單局遊戲變數 
    let gameCoins = 0;
    let equippedSkin = '#d93228';
    let bestScore = Number(localStorage.getItem('healthGameBestScore') || 0);
    let hasSprintShoes = false;
    let hasTrail = false; 

    const player = {
      x: 610,
      y: groundY - 58,
      w: 38,
      h: 58,
      vx: 0,
      vy: 0,
      speed: 5.2, 
      jump: 18.6,
      onGround: false,
      face: 1,
      hasShield: false
    };

    const levels = [
      { question: '第 1 題：一般成人每週建議至少多少中等強度身體活動？', correct: 1, options: ['30 分鐘', '150 分鐘', '60 分鐘', '300 分鐘'], explain: '成人每週建議至少 150 分鐘中等強度身體活動。' },
      { question: '第 2 題：多數成人每日建議睡眠時間最接近哪一項？', correct: 2, options: ['5 小時', '11 小時', '7–9 小時', '3 小時'], explain: '多數成人建議每日睡眠 7–9 小時。' },
      { question: '第 3 題：哪一項較有助於預防高血壓？', correct: 0, options: ['減少鈉攝取', '高鹽飲食', '長期熬夜', '含糖飲料'], explain: '減少鈉攝取有助於血壓控制。' },
      { question: '第 4 題：下列哪一項較符合健康飲食？', correct: 3, options: ['常吃炸物', '每天宵夜', '含糖飲料', '蔬果全穀'], explain: '蔬果與全穀類富含營養。' },
      { question: '第 5 題：每日建議飲水量最接近哪一項？', correct: 1, options: ['500 ml', '1500–2000 ml', '300 ml', '4000 ml'], explain: '一般成人每日建議約 1500–2000 ml。' },
      { question: '第 6 題：哪種行為有助於心理健康？', correct: 2, options: ['長時間滑手機', '熬夜追劇', '規律運動', '過度工作'], explain: '規律運動有助於減壓與情緒調節。' },
      { question: '第 7 題：預防流感最有效的方法之一是？', correct: 0, options: ['接種疫苗', '喝可樂', '熬夜', '少洗手'], explain: '接種疫苗能有效預防流感。' },
      { question: '第 8 題：哪一項屬於良好的飲食習慣？', correct: 1, options: ['暴飲暴食', '定時定量', '只吃零食', '跳過早餐'], explain: '定時定量有助於維持健康。' },
      { question: '第 9 題：久坐族建議多久起身活動一次？', correct: 2, options: ['3 小時', '不用活動', '30–60 分鐘', '一天一次'], explain: '每 30–60 分鐘起身活動較健康。' },
      { question: '第 10 題：哪一項有助於維持心血管健康？', correct: 3, options: ['高油飲食', '抽菸', '缺乏運動', '規律運動'], explain: '規律運動有助於心血管健康。' },
      { question: '第 11 題：在台灣，一般成人的健康體位（BMI）正常範圍大約落在哪裡？', correct: 0, options: ['18.5 ~ 24', '15 ~ 18', '24 ~ 27', '超過 27'], explain: '國民健康署建議成人 BMI 應維持在 18.5 (含) 至 24 (未滿) 之間。' },
      { question: '第 12 題：下列哪一種營養素最能促進腸胃蠕動、預防便祕？', correct: 1, options: ['蛋白質', '膳食纖維', '飽和脂肪', '維生素C'], explain: '膳食纖維能增加糞便體積，促進腸胃蠕動與腸道健康。' },
      { question: '第 13 題：為了擁有良好的睡眠品質，睡前哪一種行為最不建議？', correct: 2, options: ['聽輕音樂', '拉伸放鬆', '滑手機看短影', '閱讀實體書'], explain: '螢幕藍光及強烈的聲光刺激會抑制褪黑激素分泌，嚴重影響睡眠。' },
      { question: '第 14 題：搬運重物時，下列哪一種姿勢最能保護脊椎避免受傷？', correct: 1, options: ['彎腰不彎膝蓋', '彎膝蓋並挺直背部', '單手提重物', '快速猛力拉起'], explain: '彎曲膝蓋、利用腿部力量並保持背部挺直，能大幅減少脊椎壓力。' },
      { question: '第 15 題：正確的洗手步驟中，搓揉雙手的時間建議至少維持多久？', correct: 1, options: ['5 秒', '20 秒', '1 分鐘', '隨便沖水就好'], explain: '確實搓洗雙手至少 20 秒（內外夾弓大立腕），才能有效去除手部病菌。' },
      { question: '第 16 題：身體要自然合成「維生素D」，最簡單且有效的方法是？', correct: 2, options: ['每天喝手搖飲', '待在冷氣房', '適度曬太陽', '熬夜'], explain: '人體皮膚在適度接受日照後，能自行合成維生素D，有助於骨骼與免疫健康。' },
      { question: '第 17 題：根據「20-20-20」護眼法則，用眼每 20 分鐘應該要？', correct: 1, options: ['閉眼 20 分鐘', '看 20呎外 20秒', '滴20滴眼藥水', '看螢幕 20 秒'], explain: '每用眼 20 分鐘，應眺望 20 呎（約 6 公尺）外遠方至少 20 秒來放鬆睫狀肌。' },
      { question: '第 18 題：關於日常減糖，下列哪一個觀念比較正確？', correct: 3, options: ['水果糖分可無限吃', '蜂蜜不是糖可多喝', '果汁等同新鮮水果', '喝無糖茶或白開水'], explain: '減少額外添加糖的攝取，以無糖飲品或白開水取代含糖飲料最健康。' },
      { question: '第 19 題：維持良好的口腔健康，每天至少應該刷幾次牙？', correct: 0, options: ['2 次', '不用刷', '一週 1 次', '只有早上刷'], explain: '每天至少應在早晨與睡前刷牙各一次，並建議搭配使用牙線。' },
      { question: '第 20 題：吃油炸食物容易攝取過多熱量，哪種烹調方式較健康？', correct: 1, options: ['紅燒', '清蒸或水煮', '勾芡', '糖醋'], explain: '清蒸或水煮能保留食物原味，且不需要額外添加大量油脂。' }
    ];

    let running = false;
    let finished = false;
    let currentLevel = 0;
    let score = 0;
    let lives = 3;
    let gateOpened = false;
    let transitionTimer = 0;
    let popup = '';
    let popupTimer = 0;
    let coinVisible = false;
    let coinCollected = false;
    let attempts = 0;
    let correctAnswers = 0;
    let wrongAnswers = 0;
    let lastShopLevel = -1; // 追蹤最後一次開啟商店的題號，避免重複開啟
    let currentCombo = 0;   // 追蹤連續答對次數
    let extraCoins = [];    // 存放散落的額外金幣

    const wrongBoxShake = {};
    const particles = [];
    const trailParticles = []; 

    const hazards = [];
    let hazardSpawnTimer = 0;
    const HAZARD_TYPES = [
      { name: '炸雞', color: '#ff9d00', emoji: '🍗' },
      { name: '珍奶', color: '#8b4513', emoji: '🧋' },
      { name: '甜甜圈', color: '#ff69b4', emoji: '🍩' }
    ];

    let audioCtx = null;
    function playTone(freq = 440, duration = 0.08, type = 'sine', volume = 0.08) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playJumpSound() { playTone(260, 0.07, 'square', 0.045); }
    function playWrongSound() { playTone(140, 0.12, 'sawtooth', 0.06); }
    function playCorrectSound() {
      playTone(520, 0.08, 'sine', 0.06);
      setTimeout(() => playTone(760, 0.08, 'sine', 0.055), 70);
    }
    function playCoinSound() {
      playTone(880, 0.07, 'triangle', 0.06);
      setTimeout(() => playTone(1180, 0.08, 'triangle', 0.055), 60);
    }

    function answerBoxes() {
      if (currentLevel >= levels.length) return []; 
      const startX = 165;
      const gap = 142;
      return levels[currentLevel].options.map((text, i) => ({
        x: startX + i * (BOX_W + gap),
        y: gateY - 18,
        w: BOX_W,
        h: BOX_H,
        text,
        idx: i,
        removed: gateOpened && i === levels[currentLevel].correct
      }));
    }

    function startGame() {
      winRestartBtn.classList.remove('show');
      shopModal.classList.remove('show');
      running = true;
      finished = false;
      currentLevel = 0;
      score = 0;
      lives = 3;
      
      // 確保重新開始時重置所有裝備、金幣與連擊
      gameCoins = 0; 
      equippedSkin = '#d93228';
      hasSprintShoes = false;
      hasTrail = false; 
      player.speed = 5.2; 
      player.hasShield = false;
      currentCombo = 0;
      extraCoins = [];
      
      gateOpened = false;
      transitionTimer = 0;
      coinVisible = false;
      coinCollected = false;
      attempts = 0;
      correctAnswers = 0;
      wrongAnswers = 0;
      lastShopLevel = -1;
      particles.length = 0;
      trailParticles.length = 0; 
      hazards.length = 0;
      hazardSpawnTimer = 0;
      
      Object.keys(wrongBoxShake).forEach(key => delete wrongBoxShake[key]);
      setPlayerToGround();
      setPopup('頂到正確答案箱，箱子會消失並開通往上一層的路。', 180);
      updateHud();
    }

    function setPlayerToGround() {
      player.x = 610;
      player.y = groundY - player.h;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
    }

    function updateHud() {
      scoreText.textContent = `分數：${score}`;
      coinText.textContent = `金幣：${gameCoins}`;
      lifeText.textContent = `生命：${lives}`;
      levelText.textContent = `題目：${Math.min(currentLevel + 1, levels.length)} / ${levels.length}`;
    }

    function setPopup(text, frames = 120) {
      popup = text;
      popupTimer = frames;
    }

    function jump() {
      if (!running || finished || transitionTimer > 0) return;
      if (player.onGround) {
        player.vy = -player.jump;
        player.onGround = false;
        playJumpSound();
      }
    }

    function openGate(box) {
      gateOpened = true;
      coinVisible = true;
      coinCollected = false;
      attempts += 1;
      correctAnswers += 1;
      score += 10;
      currentCombo += 1; 

      if (currentCombo > 0 && currentCombo % 10 === 0) {
        spawnExtraCoins(3);
        setPopup(`【連擊！】${levels[currentLevel].explain} 噴出額外金幣，請收集「所有金幣」過關！`, 220);
        playCorrectSound();
        setTimeout(playCoinSound, 150); 
      } else {
        setPopup(`答對了！${levels[currentLevel].explain} 請撿取金幣進入下一題。`, 180);
        playCorrectSound();
      }

      updateHud();
      spawnParticles(box.x + box.w / 2, box.y + box.h / 2, '#89ff4d', 18);
      player.y = box.y + box.h + 2;
      player.vy = -17.2;
    }

    function coinRect() {
      return { x: 610, y: upperPlatformY - 62, w: 46, h: 46 };
    }

    // 產生散落並帶有物理彈跳效果的額外金幣 (現在只會在上層平台彈跳)
    function spawnExtraCoins(count) {
      const startX = 610; 
      const startY = upperPlatformY - 62;
      for (let i = 0; i < count; i++) {
        extraCoins.push({
          x: startX,
          y: startY,
          w: 46,
          h: 46,
          vx: (Math.random() - 0.5) * 18, // 橫向隨機爆發力度
          vy: -7 - Math.random() * 8,     // 往上噴發的力度
          landed: false,
          targetY: upperPlatformY // 全部設定在上層平台掉落，避免掉到下層卡關
        });
      }
    }

    // 檢查是否全場金幣都吃光了，清光才進入下一題
    function checkAllCoinsCollected() {
      if (!coinVisible && extraCoins.length === 0 && gateOpened) {
        setPopup('準備進入下一題！', 45);
        transitionTimer = 45;
      }
    }

    function collectCoin() {
      if (!coinVisible || coinCollected) return;
      coinCollected = true;
      coinVisible = false;
      score += 5;
      gameCoins += 1; 
      updateHud();
      playCoinSound();
      const c = coinRect();
      spawnParticles(c.x + c.w / 2, c.y + c.h / 2, '#ffd83d', 26);
      checkAllCoinsCollected(); // 呼叫全收集檢查
    }

    function triggerWrongBoxFeedback(box) {
      wrongBoxShake[box.idx] = 24;
      attempts += 1;
      wrongAnswers += 1;
      currentCombo = 0; // 撞錯箱子，連擊中斷
      playWrongSound();
      setPopup('這不是正確答案，請再試一次。', 55);
    }

    function updateWrongBoxShake() {
      for (const key of Object.keys(wrongBoxShake)) {
        wrongBoxShake[key] -= 1;
        if (wrongBoxShake[key] <= 0) delete wrongBoxShake[key];
      }
    }

    function spawnParticles(x, y, color = '#ffd83d', count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.8,
          life: 38 + Math.random() * 22,
          size: 3 + Math.random() * 5,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.16;
        p.life -= 1;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updateTrailParticles() {
      if (hasTrail && running && !finished && (Math.abs(player.vx) > 0.5 || Math.abs(player.vy) > 0.5)) {
        for(let i = 0; i < 2; i++) {
          trailParticles.push({
            x: player.x + player.w / 2 + (Math.random() - 0.5) * 20,
            y: player.y + player.h / 2 + (Math.random() - 0.5) * 20 + 10,
            life: 25,
            maxLife: 25,
            color: `hsl(${(Date.now() / 8) % 360}, 100%, 65%)`, 
            size: 5 + Math.random() * 6
          });
        }
      }

      for (let i = trailParticles.length - 1; i >= 0; i--) {
        const p = trailParticles[i];
        p.life--;
        p.y -= 0.3; 
        p.size *= 0.92; 
        if (p.life <= 0) {
          trailParticles.splice(i, 1);
        }
      }
    }

    function updateHazards() {
      if (currentLevel < 2 || !running || finished || transitionTimer > 0) return;

      hazardSpawnTimer--;
      if (hazardSpawnTimer <= 0) {
        hazards.push({
          x: Math.random() * (W - 40),
          y: -50,
          w: 45,
          h: 45,
          vy: 2 + Math.random() * 3,
          type: HAZARD_TYPES[Math.floor(Math.random() * HAZARD_TYPES.length)]
        });
        hazardSpawnTimer = 100 + Math.random() * 80;
      }

      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.y += h.vy;

        if (rectsIntersect(player, h)) {
          hazards.splice(i, 1);
          
          if (player.hasShield) {
            player.hasShield = false;
            playCorrectSound();
            setPopup(`防護罩成功抵擋了 ${h.type.name}！`, 60);
            spawnParticles(player.x + player.w/2, player.y + player.h/2, '#64c8ff', 20);
            continue;
          }

          lives -= 1;
          playWrongSound();
          setPopup(`哎呀！被${h.type.name}砸中了，生命值 -1！`, 60);
          spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 10);
          updateHud();
          
          if (lives <= 0) {
            finished = true;
            setPopup('體力耗盡，遊戲結束！', 99999);
            winRestartBtn.classList.add('show');
          }
          continue;
        }

        if (h.y > H) hazards.splice(i, 1);
      }
    }

    function nextLevel() {
      currentLevel += 1;
      
      if (currentLevel >= levels.length) {
        finished = true;
        bestScore = Math.max(bestScore, score);
        localStorage.setItem('healthGameBestScore', String(bestScore));

      }

      resumeNextLevelSetup();
    }

    function rectsIntersect(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function getBarrierRects() {
      const rects = [];
      const boxes = answerBoxes();
      const correctIdx = levels[currentLevel].correct;
      const correctBox = boxes[correctIdx];
      const openGap = gateOpened ? { x: correctBox.x - 8, y: gateY - 6, w: correctBox.w + 16, h: BOX_H + 24 } : null;

      for (const box of boxes) {
        if (!box.removed) {
          rects.push({ ...box, type: box.idx === correctIdx ? 'correctBox' : 'wrongBox' });
        }
      }
      for (let x = 0; x < W; x += BRICK_W) {
        const brick = { x, y: gateY, w: BRICK_W, h: BRICK_H, type: 'brick' };
        const insideOpenedGap = openGap && rectsIntersect(brick, openGap);
        if (!insideOpenedGap) rects.push(brick);
      }
      return rects;
    }

    function resolveBarrierCollision(prev) {
      const solids = getBarrierRects();
      for (const solid of solids) {
        if (!rectsIntersect(player, solid)) continue;

        const prevBottom = prev.y + player.h;
        const prevTop = prev.y;
        const prevRight = prev.x + player.w;
        const prevLeft = prev.x;

        if (prevTop >= solid.y + solid.h - 2 && player.vy < 0) {
          player.y = solid.y + solid.h + 0.5;
          if (solid.type === 'correctBox' && !gateOpened) {
            openGate(solid);
          } else {
            if (solid.type === 'wrongBox') triggerWrongBoxFeedback(solid);
            player.vy = 2.8;
          }
          return;
        }

        if (prevBottom <= solid.y + 2 && player.vy >= 0) {
          player.y = solid.y - player.h;
          player.vy = 0;
          player.onGround = true;
          return;
        }

        if (prevRight <= solid.x + 2) {
          player.x = solid.x - player.w;
          player.vx = 0;
          return;
        }
        if (prevLeft >= solid.x + solid.w - 2) {
          player.x = solid.x + solid.w;
          player.vx = 0;
          return;
        }
      }
    }

    function update() {
      if (!running) {
        if (popupTimer > 0) popupTimer--;
        return;
      }
      if (finished) {
        if (popupTimer > 0) popupTimer--;
        return;
      }

      if (transitionTimer > 0) {
        transitionTimer--;
        updateWrongBoxShake();
        updateParticles();
        updateTrailParticles(); 
        
        // 過渡期間還是允許玩家移動（看起來比較流暢）
        if (keys.ArrowLeft || keys.a || keys.A) {
          player.vx = -player.speed;
          player.face = -1;
        } else if (keys.ArrowRight || keys.d || keys.D) {
          player.vx = player.speed;
          player.face = 1;
        } else {
          player.vx *= 0.76;
          if (Math.abs(player.vx) < 0.12) player.vx = 0;
        }
        player.x += player.vx;
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > W) player.x = W - player.w;

        // 在過渡期間檢查額外金幣碰撞
        for (let i = extraCoins.length - 1; i >= 0; i--) {
          if (rectsIntersect(player, extraCoins[i])) {
            score += 5;
            gameCoins += 1;
            updateHud();
            playCoinSound();
            spawnParticles(extraCoins[i].x + extraCoins[i].w / 2, extraCoins[i].y + extraCoins[i].h / 2, '#ffd83d', 26);
            extraCoins.splice(i, 1);
          }
        }

        if (transitionTimer === 0) nextLevel();
        return;
      }

      if (keys.ArrowLeft || keys.a || keys.A) {
        player.vx = -player.speed;
        player.face = -1;
      } else if (keys.ArrowRight || keys.d || keys.D) {
        player.vx = player.speed;
        player.face = 1;
      } else {
        player.vx *= 0.76;
        if (Math.abs(player.vx) < 0.12) player.vx = 0;
      }

      player.vy += 0.58;
      if (player.vy > 14) player.vy = 14;

      const prev = { x: player.x, y: player.y };
      const prevBottom = player.y + player.h;

      player.x += player.vx;
      player.y += player.vy;

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > W) player.x = W - player.w;

      player.onGround = false;

      if (prevBottom <= groundY && player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.onGround = true;
      }

      resolveBarrierCollision(prev);

      if (gateOpened && prevBottom <= upperPlatformY && player.y + player.h >= upperPlatformY) {
        player.y = upperPlatformY - player.h;
        player.vy = 0;
        player.onGround = true;
      }

      if (coinVisible && rectsIntersect(player, coinRect())) {
        collectCoin();
      }

      // 處理額外金幣的物理動畫
      for (let i = 0; i < extraCoins.length; i++) {
        let c = extraCoins[i];
        if (!c.landed) {
          c.vy += 0.5; // 重力
          c.x += c.vx;
          c.y += c.vy;

          // 左右邊界反彈
          if (c.x < 0) { c.x = 0; c.vx *= -0.6; }
          if (c.x + c.w > W) { c.x = W - c.w; c.vx *= -0.6; }

          // 落地反彈
          if (c.y + c.h >= c.targetY) {
            c.y = c.targetY - c.h;
            c.vy *= -0.5; // Y軸反彈
            c.vx *= 0.8;  // X軸摩擦力減速
            if (Math.abs(c.vy) < 1.5) {
              c.vy = 0;
              c.vx = 0;
              c.landed = true; // 金幣停在平台上
            }
          }
        }
      }

      // 檢查玩家是否吃到額外金幣
      for (let i = extraCoins.length - 1; i >= 0; i--) {
        if (rectsIntersect(player, extraCoins[i])) {
          score += 5;
          gameCoins += 1;
          updateHud();
          playCoinSound();
          spawnParticles(extraCoins[i].x + extraCoins[i].w / 2, extraCoins[i].y + extraCoins[i].h / 2, '#ffd83d', 26);
          extraCoins.splice(i, 1);
          checkAllCoinsCollected(); // 每次吃金幣都檢查是否清空全場
        }
      }

      if (popupTimer > 0) popupTimer--;
      updateWrongBoxShake();
      updateParticles();
      updateTrailParticles(); 
      updateHazards(); 
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, H);
      gradient.addColorStop(0, '#73cdd7');
      gradient.addColorStop(1, '#334c25');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);
    }

    function drawVersionLabel() {

    function drawBrick(x, y, w = BRICK_W, h = BRICK_H) {
      ctx.fillStyle = '#7b3d1f';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#a2532b';
      ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
      ctx.strokeStyle = '#4c230f';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(x + 5, y + 5, w - 10, 5);
    }

    function drawBrickLineExceptGate() {
      if (currentLevel >= levels.length) {
        for (let x = 0; x < W; x += BRICK_W) drawBrick(x, gateY, BRICK_W, BRICK_H);
        return;
      }
      const boxes = answerBoxes();
      const correctBox = boxes[levels[currentLevel].correct];
      const openGap = gateOpened ? { x: correctBox.x - 8, y: gateY - 6, w: correctBox.w + 16, h: BOX_H + 24 } : null;

      for (let x = 0; x < W; x += BRICK_W) {
        const brick = { x, y: gateY, w: BRICK_W, h: BRICK_H };
        const insideOpenedGap = openGap && rectsIntersect(brick, openGap);
        if (!insideOpenedGap) drawBrick(x, gateY, BRICK_W, BRICK_H);
      }
    }

    function drawUpperPlatform() {
      for (let x = 0; x < W; x += BRICK_W) drawBrick(x, upperPlatformY, BRICK_W, BRICK_H);
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(0, upperPlatformY - 3, W, 3);
    }

    function drawGroundPlatform() {
      for (let x = 0; x < W; x += BRICK_W) drawBrick(x, groundY, BRICK_W, BRICK_H);
    }

    function drawAnswerBox(box) {
      if (box.removed) return;
      const shakeFrames = wrongBoxShake[box.idx] || 0;
      const shakeOffset = shakeFrames > 0 ? Math.sin(shakeFrames * 1.15) * 8 : 0;
      const yBump = shakeFrames > 0 ? Math.sin(shakeFrames * 0.8) * 2 : 0;
      const drawX = box.x + shakeOffset;
      const drawY = box.y + yBump;
      ctx.save();
      if (shakeFrames > 0) {
        ctx.shadowColor = 'rgba(255, 40, 40, 0.65)';
        ctx.shadowBlur = 14;
      }
      ctx.fillStyle = '#5bc92f';
      ctx.fillRect(drawX, drawY, box.w, box.h);
      ctx.fillStyle = shakeFrames > 0 ? '#7df047' : '#83ee4b';
      ctx.fillRect(drawX + 5, drawY + 5, box.w - 10, box.h - 10);
      ctx.strokeStyle = shakeFrames > 0 ? '#d62828' : '#2e7019';
      ctx.lineWidth = 4;
      ctx.strokeRect(drawX, drawY, box.w, box.h);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(drawX + 10, drawY + 10, box.w - 20, 12);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 19px "Microsoft JhengHei"';
      wrapCenter(box.text, drawX + box.w / 2, drawY + 36, box.w - 10, 21);
      ctx.restore();
    }

    // 獨立出繪製單個金幣的函式，讓主金幣和散落金幣共用
    function drawCoinItem(c) {
      const pulse = Math.sin(Date.now() / 120) * 3;
      const size = c.w + pulse;
      const cx = c.x + c.w / 2;
      const cy = c.y + c.h / 2;

      ctx.save();
      ctx.fillStyle = '#ffd83d';
      ctx.beginPath();
      ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b56b00';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fillStyle = '#fff4a3';
      ctx.beginPath();
      ctx.arc(cx - 9, cy - 10, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e19a00';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, size / 2 - 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#d98400';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('$', cx, cy + 8);
      ctx.restore();
    }

    function drawCoin() {
      if (coinVisible) drawCoinItem(coinRect()); // 繪製主要過關金幣
      extraCoins.forEach(drawCoinItem); // 繪製散落的額外金幣
    }

    function drawParticles() {
      ctx.save();
      for (const p of particles) {
        ctx.globalAlpha = Math.max(p.life / 55, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawTrailParticles() {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of trailParticles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawHazards() {
      hazards.forEach(h => {
        ctx.save();
        ctx.fillStyle = h.type.color;
        ctx.beginPath();
        ctx.arc(h.x + h.w/2, h.y + h.h/2, h.w/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = '30px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(h.type.emoji, h.x + h.w/2, h.y + h.h/2 + 3);
        ctx.restore();
      });
    }

    function wrapCenter(text, x, y, maxWidth, lineHeight) {
      const chars = [...text];
      let line = '';
      const lines = [];
      for (const ch of chars) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = ch;
        } else line = test;
      }
      if (line) lines.push(line);
      lines.slice(0, 2).forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      
      // 若擁有防護罩，繪製藍色光圈
      if (player.hasShield) {
        ctx.beginPath();
        ctx.arc(19, 29, 36, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(100, 200, 255, 0.8)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = 'rgba(100, 200, 255, 0.2)';
        ctx.fill();
      }

      // 套用裝備的顏色
      ctx.fillStyle = equippedSkin;
      ctx.beginPath();
      ctx.ellipse(19, 13, 17, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe0c2';
      ctx.beginPath();
      ctx.arc(21, 25, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#244f9a';
      ctx.fillRect(8, 34, 26, 18);
      ctx.fillRect(6, 50, 10, 8);
      ctx.fillRect(24, 50, 10, 8);
      ctx.fillStyle = '#6a3a1f';
      ctx.fillRect(7, 56, 12, 4);
      ctx.fillRect(23, 56, 12, 4);
      ctx.fillStyle = '#fff';
      ctx.fillRect(player.face === 1 ? 25 : 15, 23, 3, 3);
      ctx.restore();
    }

    function drawPopup() {
      if (!popup || popupTimer <= 0) return;
      ctx.save();
      ctx.globalAlpha = Math.min(1, popupTimer / 20);
      ctx.fillStyle = 'rgba(20,28,18,0.74)';
      ctx.fillRect(150, 110, 980, 62);
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.strokeRect(150, 110, 980, 62);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 24px "Microsoft JhengHei"';
      ctx.fillText(popup, W / 2, 150);
      ctx.restore();
    }

    function drawOverlay() {
      if (running && !finished) return;
      ctx.save();

      if (finished && lives > 0) {
        ctx.fillStyle = 'rgba(7, 18, 8, 0.68)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(255, 255, 245, 0.97)';
        ctx.fillRect(210, 120, 860, 540);
        ctx.strokeStyle = '#ffd83d';
        ctx.lineWidth = 8;
        ctx.strokeRect(210, 120, 860, 540);
        ctx.fillStyle = '#24431a';
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px "Microsoft JhengHei"';
        ctx.fillText('恭喜！通關完成', W / 2, 330);
        ctx.font = '24px "Microsoft JhengHei"';
        ctx.fillText(`最終分數：${score}　最終持有金幣：${gameCoins}`, W / 2, 425);
        ctx.font = '22px "Microsoft JhengHei"';
        ctx.fillText('按下方「重新開始」可再次挑戰', W / 2, 595);
        ctx.restore();
        return;
      }

      ctx.fillStyle = 'rgba(10,16,8,0.52)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.94)';
      ctx.fillRect(260, 255, 760, 230);
      ctx.strokeStyle = '#78c952';
      ctx.lineWidth = 5;
      ctx.strokeRect(260, 255, 760, 230);
      ctx.fillStyle = '#24431a';
      ctx.textAlign = 'center';
      ctx.font = 'bold 40px "Microsoft JhengHei"';
      ctx.fillText(finished ? '遊戲結束' : '跳跳跳健康問答', W / 2, 330);
      ctx.font = '24px "Microsoft JhengHei"';
      ctx.fillText(finished ? `最終分數：${score}` : '碰撞正確答案，消除箱子並跳上下一層', W / 2, 378);
      ctx.fillText(finished ? '按重新開始可再次挑戰' : '按上方「開始遊戲」開始', W / 2, 420);
      ctx.restore();
    }

    function draw() {
      drawBackground();
      drawVersionLabel();
      drawQuestion();
      drawUpperPlatform();
      drawBrickLineExceptGate();
      answerBoxes().forEach(drawAnswerBox);
      drawUpperPlatform();
      drawCoin();
      drawParticles();
      drawTrailParticles(); 
      drawHazards();
      drawGroundPlatform();
      if (running) drawPlayer();
      drawPopup();
      drawOverlay();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (['ArrowUp', ' ', 'w', 'W'].includes(e.key)) {
        e.preventDefault();
        jump();
      }
    });
    document.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
    winRestartBtn.addEventListener('click', startGame);

    updateHud();
    loop();
  </script>
</body>
</html>
