<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跳跳跳健康問答</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #172313;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: #fff;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px;
    }
    .toolbar {
      width: min(1280px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hud, .btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.18);
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 700;
      backdrop-filter: blur(6px);
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 11px 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .start { background: #77d84a; color: #18300d; }
    .restart { background: #fff; color: #1c2e12; }
    .stage {
      position: relative;
      width: min(1280px, 100%);
      background: #24341d;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      border: 3px solid rgba(255,255,255,0.08);
    }
    .win-restart {
      position: absolute;
      left: 50%;
      top: 73%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 10;
      background: linear-gradient(180deg, #ffe66d, #ffb703);
      color: #3a2600;
      border: 4px solid rgba(255,255,255,0.95);
      box-shadow: 0 10px 24px rgba(0,0,0,0.32);
      padding: 14px 34px;
      font-size: 1.15rem;
      border-radius: 999px;
    }
    .win-restart.show { display: block; }
    
    /* 商店介面樣式 */
    .shop-modal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 35, 20, 0.95);
      border: 4px solid #78c952;
      border-radius: 16px;
      padding: 30px;
      width: 480px;
      text-align: center;
      z-index: 20;
      display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .shop-modal.show { display: block; }
    .shop-modal h2 { margin-top: 0; color: #ffd83d; }
    .shop-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .shop-btn {
      background: #2b4a24;
      color: #fff;
      border: 2px solid #4a803a;
      transition: background 0.2s;
    }
    .shop-btn:hover { background: #3a6331; }
    .shop-btn:disabled { background: #555; border-color: #444; color: #888; cursor: not-allowed; }
    .close-shop {
      background: #ffd83d;
      color: #3a2600;
      width: 100%;
      margin-top: 10px;
    }


    /* 角色選擇介面 */
    .character-modal {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 18;
      background: rgba(10, 18, 8, 0.62);
      backdrop-filter: blur(3px);
    }
    .character-modal.show { display: flex; }
    .character-panel {
      width: min(760px, 92%);
      background: rgba(255, 255, 245, 0.97);
      color: #24431a;
      border: 6px solid #ffd83d;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 18px 46px rgba(0,0,0,0.38);
    }
    .character-panel h2 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    .character-panel p {
      margin: 0 0 22px;
      font-weight: 700;
      color: #426834;
    }
    .character-options {
      display: flex;
      justify-content: center;
      gap: 22px;
      flex-wrap: wrap;
    }
    .character-card {
      width: 250px;
      min-height: 270px;
      background: #f8fff0;
      border: 4px solid #78c952;
      border-radius: 20px;
      padding: 14px 14px 18px;
      color: #24431a;
      box-shadow: 0 8px 20px rgba(0,0,0,0.16);
      transition: transform 0.16s, box-shadow 0.16s, border-color 0.16s;
    }
    .character-card:hover {
      transform: translateY(-4px);
      border-color: #ffb703;
      box-shadow: 0 12px 28px rgba(0,0,0,0.22);
    }
    .character-card img {
      height: 120px;
      max-width: 100%;
      object-fit: contain;
      image-rendering: auto;
      display: block;
      margin: 0 auto 10px;
    }
    .character-card strong {
      display: block;
      font-size: 1.45rem;
      margin-bottom: 6px;
    }
    .character-card span {
      display: block;
      font-size: 0.95rem;
      line-height: 1.45;
      color: #4e6b42;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(#7fc8d0, #c8dfaa 45%, #436e35 100%);
    }
    .note {
      width: min(1280px, 100%);
      color: rgba(255,255,255,0.84);
      line-height: 1.7;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div class="hud">
        <div class="pill" id="scoreText">分數：0</div>
        <div class="pill" id="coinText">金幣：0</div>
        <div class="pill" id="timerText">時間：00:00</div>
        <div class="pill" id="lifeText">生命：3</div>
        <div class="pill" id="levelText">題目：1 / 20</div>
      </div>
      <div class="btns">
        <button class="start" id="startBtn">開始遊戲</button>
        <button class="restart" id="restartBtn">重新開始</button>
        <button class="restart" id="musicBtn">音樂：開</button>
      </div>
    </div>

    <div class="stage">
      <canvas id="gameCanvas" width="1280" height="820"></canvas>
      <button class="win-restart" id="winRestartBtn">重新開始</button>
      
      <!-- 商店介面 -->
      <div id="shopModal" class="shop-modal">
        <h2>中場休息：健康補給站</h2>
        <p style="font-size:1.2rem;">累計持有金幣：<strong id="shopCoinsDisplay" style="color:#ffd83d;">0</strong></p>
        <div class="shop-items">
          <button class="shop-btn" id="buySkinBtn">購買：藍色光芒 (3 金幣)</button>
          <button class="shop-btn" id="buyShieldBtn">購買：一次性防護罩 (2 金幣)</button>
          <button class="shop-btn" id="buyHintBtn">購買：提示卡 (2 金幣)</button>
          <button class="shop-btn" id="buyMealBtn">購買：高蛋白水煮餐，恢復 1 點生命 (2 金幣)</button>
          <button class="shop-btn" id="buySprintShoesBtn">購買：衝刺跑鞋 (4 金幣)</button>
          <button class="shop-btn" id="buyTrailBtn">購買：炫彩殘影 (5 金幣)</button>
        </div>
        <button class="close-shop" id="closeShopBtn">離開商店，繼續挑戰</button>
      </div>

      <!-- 角色選擇介面 -->
      <div id="characterModal" class="character-modal show">
        <div class="character-panel">
          <h2>選擇你的健康角色</h2>
          <p>請先選擇角色，再按「開始遊戲」。左右移動時角色會依方向轉身。</p>

      { question: '第 20 題：吃油炸食物容易攝取過多熱量，哪種烹調方式較健康？', correct: 1, options: ['紅燒', '清蒸或水煮', '勾芡', '糖醋'], explain: '清蒸或水煮能保留食物原味，且不需要額外添加大量油脂。' }

    let running = false;
    let finished = false;
    let currentLevel = 0;
    let score = 0;
    let lives = 3;
    let gateOpened = false;
    let transitionTimer = 0;
    let popup = '';
    let popupTimer = 0;
    let coinVisible = false;
    let coinCollected = false;
    let attempts = 0;
    let correctAnswers = 0;
    let wrongAnswers = 0;
    let lastShopLevel = -1; // 追蹤最後一次開啟商店的題號，避免重複開啟
    let currentCombo = 0;   // 追蹤連續答對次數
    let extraCoins = [];    // 存放散落的額外金幣

    const wrongBoxShake = {};
    const particles = [];
    const trailParticles = []; 

    const hazards = [];
    let hazardSpawnTimer = 0;
    const HAZARD_TYPES = [
      { name: '炸雞', color: '#ff9d00', emoji: '🍗' },
      { name: '珍奶', color: '#8b4513', emoji: '🧋' },
      { name: '甜甜圈', color: '#ff69b4', emoji: '🍩' }
    ];

    let audioCtx = null;
    function playTone(freq = 440, duration = 0.08, type = 'sine', volume = 0.08) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playJumpSound() { playTone(260, 0.07, 'square', 0.045); }
    function playWrongSound() { playTone(140, 0.12, 'sawtooth', 0.06); }
    function playCorrectSound() {
      playTone(520, 0.08, 'sine', 0.06);
      setTimeout(() => playTone(760, 0.08, 'sine', 0.055), 70);
    }
    function playCoinSound() {
      playTone(880, 0.07, 'triangle', 0.06);
      setTimeout(() => playTone(1180, 0.08, 'triangle', 0.055), 60);
    }

    // 輕快背景音樂：使用 Web Audio API 產生簡單循環旋律，不需外部音檔。
    // 瀏覽器通常需要玩家按下按鈕後才允許播放聲音，因此會在開始遊戲時啟動。
    let musicEnabled = true;
    let musicLoopTimer = null;
    let musicStep = 0;
    const bgmNotes = [
      392, 440, 494, 587,
      494, 440, 392, 330,
      392, 440, 494, 659,
      587, 494, 440, 392
    ];

    function playMusicNote(freq) {
      if (!musicEnabled || finished) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'triangle';
        osc.frequency.value = freq;
        filter.type = 'lowpass';
        filter.frequency.value = 1800;

        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.025, audioCtx.currentTime + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.28);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (e) {}
    }

    function startBackgroundMusic() {
      if (!musicEnabled || musicLoopTimer) return;
      musicLoopTimer = setInterval(() => {
        if (running && !finished && !shopModal.classList.contains('show')) {
          playMusicNote(bgmNotes[musicStep % bgmNotes.length]);
          musicStep += 1;
        }
      }, 360);
    }

    function stopBackgroundMusic() {
      if (musicLoopTimer) {
        clearInterval(musicLoopTimer);
        musicLoopTimer = null;
      }
    }

    function updateMusicButton() {
      musicBtn.textContent = musicEnabled ? '音樂：開' : '音樂：關';
    }

    function answerBoxes() {
      if (currentLevel >= levels.length) return []; 
      const startX = 165;
      const gap = 142;
      return levels[currentLevel].options.map((text, i) => ({
        x: startX + i * (BOX_W + gap),
        y: gateY - 18,
        w: BOX_W,
        h: BOX_H,
        text,
        idx: i,
        hinted: hintedWrongIdx === i,
        removed: gateOpened && i === levels[currentLevel].correct
      }));
    }

    function startGame() {
      if (!selectedCharacter) {
        characterModal.classList.add('show');
        setPopup('請先選擇小傑或娜娜，再開始遊戲。', 150);
        return;
      }
      winRestartBtn.classList.remove('show');
      shopModal.classList.remove('show');
      characterModal.classList.remove('show');
      running = true;
      finished = false;
      currentLevel = 0;
      score = 0;
      lives = MAX_LIVES;

      // 重新開始時計時歸零，並從按下開始的當下重新計時
      timerStartTime = performance.now();
      pausedDuration = 0;
      pauseStartTime = 0;
      finalElapsedTime = 0;
      
      // 確保重新開始時重置所有裝備、金幣與連擊
      gameCoins = 0; 
      equippedSkin = '#d93228';
      hasHintCard = false;
      hintedWrongIdx = null;
      hasSprintShoes = false;
      hasTrail = false; 
      player.speed = 5.2; 
      player.hasShield = false;
      currentCombo = 0;
      extraCoins = [];
      
      gateOpened = false;
      transitionTimer = 0;
      coinVisible = false;
      coinCollected = false;
      attempts = 0;
      correctAnswers = 0;
      wrongAnswers = 0;
      lastShopLevel = -1;
      particles.length = 0;
      trailParticles.length = 0; 
      hazards.length = 0;
      hazardSpawnTimer = 0;
      
      Object.keys(wrongBoxShake).forEach(key => delete wrongBoxShake[key]);
      setPlayerToGround();
      setPopup('碰撞正確答案箱，箱子會消失並開通往上一層的路。', 180);
      updateHud();
      startBackgroundMusic();
    }

    function setPlayerToGround() {
      player.x = 610;
      player.y = groundY - player.h;
      player.vx = 0;
      player.vy = 0;
      player.onGround = true;
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function getElapsedSeconds() {
      if (!timerStartTime) return 0;
      const now = performance.now();
      return Math.floor((now - timerStartTime - pausedDuration) / 1000);
    }

    function updateTimerHud() {
      const timeToShow = finished ? finalElapsedTime : getElapsedSeconds();
      timerText.textContent = `時間：${formatTime(timeToShow)}`;
    }

    function updateHud() {
      scoreText.textContent = `分數：${score}`;
      coinText.textContent = `金幣：${gameCoins}`;
      lifeText.textContent = `生命：${lives}`;
      levelText.textContent = `題目：${Math.min(currentLevel + 1, levels.length)} / ${levels.length}`;
      updateTimerHud();
    }

    function setPopup(text, frames = 120) {
      popup = text;
      popupTimer = frames;
    }

    function jump() {
      if (!running || finished || transitionTimer > 0) return;
      if (player.onGround) {
        player.vy = -player.jump;
        player.onGround = false;
        playJumpSound();
      }
    }

    function openGate(box) {
      gateOpened = true;
      coinVisible = true;
      coinCollected = false;
      attempts += 1;
      correctAnswers += 1;
      score += 10;
      currentCombo += 1; 

      if (currentCombo > 0 && currentCombo % 10 === 0) {
        spawnExtraCoins(3);
        setPopup(`【連擊！】${levels[currentLevel].explain} 噴出額外金幣，請收集「所有金幣」過關！`, 220);
        playCorrectSound();
        setTimeout(playCoinSound, 150); 
      } else {
        setPopup(`答對了！${levels[currentLevel].explain} 請撿取金幣進入下一題。`, 180);
        playCorrectSound();
      }

      updateHud();
      spawnParticles(box.x + box.w / 2, box.y + box.h / 2, '#89ff4d', 18);
      player.y = box.y + box.h + 2;
      player.vy = -17.2;
    }

    function coinRect() {
      return { x: 610, y: upperPlatformY - 62, w: 46, h: 46 };
    }

    // 產生散落並帶有物理彈跳效果的額外金幣 (現在只會在上層平台彈跳)
    function spawnExtraCoins(count) {
      const startX = 610; 
      const startY = upperPlatformY - 62;
      for (let i = 0; i < count; i++) {
        extraCoins.push({
          x: startX,
          y: startY,
          w: 46,
          h: 46,
          vx: (Math.random() - 0.5) * 18, // 橫向隨機爆發力度
          vy: -7 - Math.random() * 8,     // 往上噴發的力度
          landed: false,
          targetY: upperPlatformY // 全部設定在上層平台掉落，避免掉到下層卡關
        });
      }
    }

    // 檢查是否全場金幣都吃光了，清光才進入下一題
    function checkAllCoinsCollected() {
      if (!coinVisible && extraCoins.length === 0 && gateOpened) {
        setPopup('準備進入下一題！', 45);
        transitionTimer = 45;
      }
    }

    function collectCoin() {
      if (!coinVisible || coinCollected) return;
      coinCollected = true;
      coinVisible = false;
      score += 5;
      gameCoins += 1; 
      updateHud();
      playCoinSound();
      const c = coinRect();
      spawnParticles(c.x + c.w / 2, c.y + c.h / 2, '#ffd83d', 26);
      checkAllCoinsCollected(); // 呼叫全收集檢查
    }

    function triggerWrongBoxFeedback(box) {
      wrongBoxShake[box.idx] = 24;
      attempts += 1;
      wrongAnswers += 1;
      currentCombo = 0; // 撞錯箱子，連擊中斷
      playWrongSound();
      setPopup('這不是正確答案，請再試一次。', 55);
    }

    function updateWrongBoxShake() {
      for (const key of Object.keys(wrongBoxShake)) {
        wrongBoxShake[key] -= 1;
        if (wrongBoxShake[key] <= 0) delete wrongBoxShake[key];
      }
    }

    function spawnParticles(x, y, color = '#ffd83d', count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.8,
          life: 38 + Math.random() * 22,
          size: 3 + Math.random() * 5,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.16;
        p.life -= 1;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updateTrailParticles() {
      if (hasTrail && running && !finished && (Math.abs(player.vx) > 0.5 || Math.abs(player.vy) > 0.5)) {
        for(let i = 0; i < 2; i++) {
          trailParticles.push({
            x: player.x + player.w / 2 + (Math.random() - 0.5) * 20,
            y: player.y + player.h / 2 + (Math.random() - 0.5) * 20 + 10,
            life: 25,
            maxLife: 25,
            color: `hsl(${(Date.now() / 8) % 360}, 100%, 65%)`, 
            size: 5 + Math.random() * 6
          });
        }
      }

      for (let i = trailParticles.length - 1; i >= 0; i--) {
        const p = trailParticles[i];
        p.life--;
        p.y -= 0.3; 
        p.size *= 0.92; 
        if (p.life <= 0) {
          trailParticles.splice(i, 1);
        }
      }
    }

    function updateHazards() {
      if (currentLevel < 2 || !running || finished || transitionTimer > 0) return;

      hazardSpawnTimer--;
      if (hazardSpawnTimer <= 0) {
        hazards.push({
          x: Math.random() * (W - 40),
          y: -50,
          w: 45,
          h: 45,
          vy: 2 + Math.random() * 3,
          type: HAZARD_TYPES[Math.floor(Math.random() * HAZARD_TYPES.length)]
        });
        hazardSpawnTimer = 100 + Math.random() * 80;
      }

      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.y += h.vy;

        if (rectsIntersect(player, h)) {
          hazards.splice(i, 1);
          
          if (player.hasShield) {
            player.hasShield = false;
            playCorrectSound();
            setPopup(`防護罩成功抵擋了 ${h.type.name}！`, 60);
            spawnParticles(player.x + player.w/2, player.y + player.h/2, '#64c8ff', 20);
            continue;
          }

          lives -= 1;
          playWrongSound();
          setPopup(`哎呀！被${h.type.name}砸中了，生命值 -1！`, 60);
          spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 10);
          updateHud();
          
          if (lives <= 0) {
            finalElapsedTime = getElapsedSeconds();
            finished = true;
            stopBackgroundMusic();
            setPopup('體力耗盡，遊戲結束！', 99999);
            winRestartBtn.classList.add('show');
          }
          continue;
        }

        if (h.y > H) hazards.splice(i, 1);
      }
    }

    function nextLevel() {
      currentLevel += 1;
      
      if (currentLevel >= levels.length) {
        finalElapsedTime = getElapsedSeconds();
        finished = true;
        stopBackgroundMusic();
        bestScore = Math.max(bestScore, score);
        localStorage.setItem('healthGameBestScore', String(bestScore));
        setPopup('恭喜！你已收集到所有金幣，挑戰成功！', 99999);
        winRestartBtn.classList.add('show');
        updateHud();
        return;
      }

      // 檢查是否符合開啟商店的條件
      if ((currentLevel === 7 || currentLevel === 12 || currentLevel === 17) && lastShopLevel !== currentLevel) {
        lastShopLevel = currentLevel; 
        openShop();
        return; 
      }

      resumeNextLevelSetup();
    }

    function applyHintCardForCurrentLevel() {
      hintedWrongIdx = null;
      if (!hasHintCard || currentLevel >= levels.length) return false;
      const correctIdx = levels[currentLevel].correct;
      const wrongIdxs = levels[currentLevel].options
        .map((_, i) => i)
        .filter(i => i !== correctIdx);
      hintedWrongIdx = wrongIdxs[Math.floor(Math.random() * wrongIdxs.length)];
      hasHintCard = false;
      return true;
    }

    function resumeNextLevelSetup() {
      gateOpened = false;
      transitionTimer = 0;
      coinVisible = false;
      coinCollected = false;
      hazards.length = 0; 
      extraCoins = []; // 雙重保險
      Object.keys(wrongBoxShake).forEach(key => delete wrongBoxShake[key]);
      const hintUsed = applyHintCardForCurrentLevel();
      setPlayerToGround();
      setPopup(hintUsed ? '提示卡已使用：已在一個錯誤答案上標示叉叉。' : '進入下一題。請碰撞出正確答案。', 150);
      updateHud();
    }

    // 商店系統邏輯
    function openShop() {
      pauseStartTime = performance.now();
      running = false;
      shopModal.classList.add('show');
      updateShopUI();
    }

    function updateShopUI() {
      shopCoinsDisplay.textContent = gameCoins;
      // 判斷藍色光芒按鈕狀態
      if (equippedSkin === '#24869a') {
        buySkinBtn.textContent = '已裝備：藍色光芒';

    function rectsIntersect(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function getBarrierRects() {
      const rects = [];
      const boxes = answerBoxes();
      const correctIdx = levels[currentLevel].correct;
      const correctBox = boxes[correctIdx];
      const openGap = gateOpened ? { x: correctBox.x - 8, y: gateY - 6, w: correctBox.w + 16, h: BOX_H + 24 } : null;

      for (const box of boxes) {
        if (!box.removed) {
          rects.push({ ...box, type: box.idx === correctIdx ? 'correctBox' : 'wrongBox' });
        }
      }

      // 碰撞優化：未答對前，在答案箱與磚塊區域加上隱形連續阻擋牆。
      // 這可以避免玩家從答案箱與磚塊之間的細縫或斜向碰撞漏洞跳到上層。
      // 正確答案箱仍保留在前面，所以從下方碰撞正確答案箱仍會正常開門。
      if (!gateOpened) {
        rects.push({
          x: 0,
          y: upperPlatformY,
          w: W,
          h: gateY + BRICK_H - upperPlatformY,
          type: 'hiddenGateWall'
        });
      }

      for (let x = 0; x < W; x += BRICK_W) {
        const brick = { x, y: gateY, w: BRICK_W, h: BRICK_H, type: 'brick' };
        const insideOpenedGap = openGap && rectsIntersect(brick, openGap);
        if (!insideOpenedGap) rects.push(brick);
      }
      return rects;
    }

    function resolveBarrierCollision(prev) {
      const solids = getBarrierRects();
      for (const solid of solids) {
        if (!rectsIntersect(player, solid)) continue;

        const prevBottom = prev.y + player.h;
        const prevTop = prev.y;
        const prevRight = prev.x + player.w;
        const prevLeft = prev.x;

        if (prevTop >= solid.y + solid.h - 2 && player.vy < 0) {
          player.y = solid.y + solid.h + 0.5;
          if (solid.type === 'correctBox' && !gateOpened) {
            openGate(solid);
          } else {
            if (solid.type === 'wrongBox') triggerWrongBoxFeedback(solid);
            player.vy = 2.8;
          }
          return;
        }

        if (prevBottom <= solid.y + 2 && player.vy >= 0) {
          player.y = solid.y - player.h;
          player.vy = 0;
          player.onGround = true;
          return;
        }

        if (prevRight <= solid.x + 2) {
          player.x = solid.x - player.w;
          player.vx = 0;
          return;
        }
        if (prevLeft >= solid.x + solid.w - 2) {
          player.x = solid.x + solid.w;
          player.vx = 0;
          return;
        }
      }
    }

    function update() {
      updateTimerHud();
      if (!running) {
        if (popupTimer > 0) popupTimer--;
        return;
      }
      if (finished) {
        if (popupTimer > 0) popupTimer--;
        return;
      }

      if (transitionTimer > 0) {
        transitionTimer--;
        updateWrongBoxShake();
        updateParticles();
        updateTrailParticles(); 
        
        // 過渡期間還是允許玩家移動（看起來比較流暢）
        if (keys.ArrowLeft || keys.a || keys.A) {
          player.vx = -player.speed;
          player.face = -1;
        } else if (keys.ArrowRight || keys.d || keys.D) {
          player.vx = player.speed;
          player.face = 1;
        } else {
          player.vx *= 0.76;
          if (Math.abs(player.vx) < 0.12) player.vx = 0;
        }
        player.x += player.vx;
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > W) player.x = W - player.w;

        // 在過渡期間檢查額外金幣碰撞
        for (let i = extraCoins.length - 1; i >= 0; i--) {
          if (rectsIntersect(player, extraCoins[i])) {
            score += 5;
            gameCoins += 1;
            updateHud();
            playCoinSound();
            spawnParticles(extraCoins[i].x + extraCoins[i].w / 2, extraCoins[i].y + extraCoins[i].h / 2, '#ffd83d', 26);
            extraCoins.splice(i, 1);
          }
        }

        if (transitionTimer === 0) nextLevel();
        return;
      }

      if (keys.ArrowLeft || keys.a || keys.A) {
        player.vx = -player.speed;
        player.face = -1;
      } else if (keys.ArrowRight || keys.d || keys.D) {
        player.vx = player.speed;
        player.face = 1;
      } else {
        player.vx *= 0.76;
        if (Math.abs(player.vx) < 0.12) player.vx = 0;
      }

      player.vy += 0.58;
      if (player.vy > 14) player.vy = 14;

      const prev = { x: player.x, y: player.y };
      const prevBottom = player.y + player.h;

      player.x += player.vx;
      player.y += player.vy;

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > W) player.x = W - player.w;

      player.onGround = false;

      if (prevBottom <= groundY && player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.onGround = true;
      }

      resolveBarrierCollision(prev);

      if (gateOpened && prevBottom <= upperPlatformY && player.y + player.h >= upperPlatformY) {
        player.y = upperPlatformY - player.h;
        player.vy = 0;
        player.onGround = true;
      }

      if (coinVisible && rectsIntersect(player, coinRect())) {
        collectCoin();
      }

      // 處理額外金幣的物理動畫
      for (let i = 0; i < extraCoins.length; i++) {
        let c = extraCoins[i];
        if (!c.landed) {
          c.vy += 0.5; // 重力
          c.x += c.vx;
          c.y += c.vy;

          // 左右邊界反彈
          if (c.x < 0) { c.x = 0; c.vx *= -0.6; }
          if (c.x + c.w > W) { c.x = W - c.w; c.vx *= -0.6; }

          // 落地反彈
          if (c.y + c.h >= c.targetY) {
            c.y = c.targetY - c.h;
            c.vy *= -0.5; // Y軸反彈
            c.vx *= 0.8;  // X軸摩擦力減速
            if (Math.abs(c.vy) < 1.5) {
              c.vy = 0;
              c.vx = 0;
              c.landed = true; // 金幣停在平台上
            }
          }
        }
      }

      // 檢查玩家是否吃到額外金幣
      for (let i = extraCoins.length - 1; i >= 0; i--) {
        if (rectsIntersect(player, extraCoins[i])) {
          score += 5;
          gameCoins += 1;
          updateHud();
          playCoinSound();
          spawnParticles(extraCoins[i].x + extraCoins[i].w / 2, extraCoins[i].y + extraCoins[i].h / 2, '#ffd83d', 26);
          extraCoins.splice(i, 1);
          checkAllCoinsCollected(); // 每次吃金幣都檢查是否清空全場
        }
      }

      if (popupTimer > 0) popupTimer--;
      updateWrongBoxShake();
      updateParticles();
      updateTrailParticles(); 
      updateHazards(); 
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, H);
      gradient.addColorStop(0, '#73cdd7');
      gradient.addColorStop(1, '#334c25');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);
    }

    function drawVersionLabel() {
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.82)';
      ctx.font = 'bold 16px "Microsoft JhengHei"';
      ctx.textAlign = 'right';
      ctx.fillText('v2.9 修正金幣掉落版', W - 24, 32);

    function drawQuestion() {
      const lv = levels[currentLevel] || levels[levels.length - 1];
      ctx.save();
      ctx.font = 'bold 38px "Microsoft JhengHei"';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.lineWidth = 8;
      const x = 70;
      const y = 60;
      const maxWidth = W - 140;
      const lineHeight = 46;
      const chars = [...lv.question];
      let line = '';
      const lines = [];
      for (const ch of chars) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = ch;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      ctx.strokeStyle = 'rgba(22,36,16,0.78)';
      ctx.fillStyle = '#fff';
      lines.slice(0, 2).forEach((text, i) => {
        ctx.strokeText(text, x, y + i * lineHeight);
        ctx.fillText(text, x, y + i * lineHeight);
      });
      ctx.restore();
    }

    function drawBrick(x, y, w = BRICK_W, h = BRICK_H) {
      ctx.fillStyle = '#7b3d1f';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#a2532b';
      ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
      ctx.strokeStyle = '#4c230f';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(x + 5, y + 5, w - 10, 5);
    }

    function drawBrickLineExceptGate() {
      if (currentLevel >= levels.length) {
        for (let x = 0; x < W; x += BRICK_W) drawBrick(x, gateY, BRICK_W, BRICK_H);
        return;
      }
      const boxes = answerBoxes();
      const correctBox = boxes[levels[currentLevel].correct];
      const openGap = gateOpened ? { x: correctBox.x - 8, y: gateY - 6, w: correctBox.w + 16, h: BOX_H + 24 } : null;

      for (let x = 0; x < W; x += BRICK_W) {
        const brick = { x, y: gateY, w: BRICK_W, h: BRICK_H };
        const insideOpenedGap = openGap && rectsIntersect(brick, openGap);
        if (!insideOpenedGap) drawBrick(x, gateY, BRICK_W, BRICK_H);
      }
    }

    function drawUpperPlatform() {
      for (let x = 0; x < W; x += BRICK_W) drawBrick(x, upperPlatformY, BRICK_W, BRICK_H);
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(0, upperPlatformY - 3, W, 3);
    }

    function drawGroundPlatform() {
      for (let x = 0; x < W; x += BRICK_W) drawBrick(x, groundY, BRICK_W, BRICK_H);
    }

    function drawAnswerBox(box) {
      if (box.removed) return;
      const shakeFrames = wrongBoxShake[box.idx] || 0;
      const shakeOffset = shakeFrames > 0 ? Math.sin(shakeFrames * 1.15) * 8 : 0;
      const yBump = shakeFrames > 0 ? Math.sin(shakeFrames * 0.8) * 2 : 0;
      const drawX = box.x + shakeOffset;
      const drawY = box.y + yBump;
      ctx.save();
      if (shakeFrames > 0) {
        ctx.shadowColor = 'rgba(255, 40, 40, 0.65)';
        ctx.shadowBlur = 14;
      }
      ctx.fillStyle = '#5bc92f';
      ctx.fillRect(drawX, drawY, box.w, box.h);
      ctx.fillStyle = shakeFrames > 0 ? '#7df047' : '#83ee4b';
      ctx.fillRect(drawX + 5, drawY + 5, box.w - 10, box.h - 10);
      ctx.strokeStyle = shakeFrames > 0 ? '#d62828' : '#2e7019';
      ctx.lineWidth = 4;
      ctx.strokeRect(drawX, drawY, box.w, box.h);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(drawX + 10, drawY + 10, box.w - 20, 12);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 19px "Microsoft JhengHei"';
      wrapCenter(box.text, drawX + box.w / 2, drawY + 36, box.w - 10, 21);
      if (box.hinted) {
        ctx.strokeStyle = '#d62828';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(drawX + 14, drawY + 14);
        ctx.lineTo(drawX + box.w - 14, drawY + box.h - 14);
        ctx.moveTo(drawX + box.w - 14, drawY + 14);
        ctx.lineTo(drawX + 14, drawY + box.h - 14);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 獨立出繪製單個金幣的函式，讓主金幣和散落金幣共用
    function drawCoinItem(c) {
      const pulse = Math.sin(Date.now() / 120) * 3;
      const size = c.w + pulse;
      const cx = c.x + c.w / 2;
      const cy = c.y + c.h / 2;

      ctx.save();
      ctx.fillStyle = '#ffd83d';
      ctx.beginPath();
      ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b56b00';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fillStyle = '#fff4a3';
      ctx.beginPath();
      ctx.arc(cx - 9, cy - 10, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e19a00';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, size / 2 - 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#d98400';
      ctx.font = 'bold 22px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('$', cx, cy + 8);
      ctx.restore();
    }

    function drawCoin() {
      if (coinVisible) drawCoinItem(coinRect()); // 繪製主要過關金幣
      extraCoins.forEach(drawCoinItem); // 繪製散落的額外金幣
    }

    function drawParticles() {
      ctx.save();
      for (const p of particles) {
        ctx.globalAlpha = Math.max(p.life / 55, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawTrailParticles() {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of trailParticles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawHazards() {
      hazards.forEach(h => {
        ctx.save();
        ctx.fillStyle = h.type.color;
        ctx.beginPath();
        ctx.arc(h.x + h.w/2, h.y + h.h/2, h.w/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = '30px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(h.type.emoji, h.x + h.w/2, h.y + h.h/2 + 3);
        ctx.restore();
      });
    }

    function wrapCenter(text, x, y, maxWidth, lineHeight) {
      const chars = [...text];
      let line = '';
      const lines = [];
      for (const ch of chars) {
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = ch;
        } else line = test;
      }
      if (line) lines.push(line);
      lines.slice(0, 2).forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
    }

    function drawPlayer() {
      const character = CHARACTER_DATA[selectedCharacter] || CHARACTER_DATA.jay;
      const img = characterImages[selectedCharacter] || characterImages.jay;
      const drawW = character.drawW;
      const drawH = character.drawH;
      const bob = running && !finished && player.onGround && Math.abs(player.vx) > 0.6
        ? Math.sin(Date.now() / 90) * 3
        : 0;
      const centerX = player.x + player.w / 2;
      const bottomY = player.y + player.h;

      ctx.save();

      // 若擁有防護罩，繪製藍色光圈
      if (player.hasShield) {
        ctx.beginPath();
        ctx.arc(centerX, bottomY - drawH / 2, Math.max(drawW, drawH) * 0.42, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(100, 200, 255, 0.8)';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.fillStyle = 'rgba(100, 200, 255, 0.18)';
        ctx.fill();
      }

      ctx.translate(centerX, bottomY);
      if (player.face === -1) ctx.scale(-1, 1);

      // 藍色光芒：購買後在角色周圍顯示藍色光暈效果
      if (equippedSkin === '#24869a') {
        ctx.shadowColor = 'rgba(63, 198, 255, 0.95)';
        ctx.shadowBlur = 16;
      }

      if (img && img.complete) {
        ctx.drawImage(img, -drawW / 2, -drawH + bob, drawW, drawH);
      } else {
        ctx.fillStyle = equippedSkin;
        ctx.fillRect(-player.w / 2, -player.h, player.w, player.h);
      }

      ctx.restore();
    }

    function drawPopup() {
      if (!popup || popupTimer <= 0) return;
      ctx.save();
      ctx.globalAlpha = Math.min(1, popupTimer / 20);
      ctx.fillStyle = 'rgba(20,28,18,0.78)';
      ctx.fillRect(110, 112, 1060, 92);
      ctx.strokeStyle = 'rgba(255,255,255,0.26)';
      ctx.lineWidth = 3;
      ctx.strokeRect(110, 112, 1060, 92);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 30px "Microsoft JhengHei"';
      wrapCenter(popup, W / 2, 150, 980, 34);
      ctx.restore();
    }

    function drawOverlay() {
      if (running && !finished) return;
      ctx.save();

      if (finished && lives > 0) {
        ctx.fillStyle = 'rgba(7, 18, 8, 0.68)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(255, 255, 245, 0.97)';
        ctx.fillRect(210, 120, 860, 540);
        ctx.strokeStyle = '#ffd83d';
        ctx.lineWidth = 8;
        ctx.strokeRect(210, 120, 860, 540);
        ctx.fillStyle = '#24431a';
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px "Microsoft JhengHei"';
        ctx.fillText('恭喜！通關完成', W / 2, 330);
        ctx.font = '24px "Microsoft JhengHei"';
        ctx.fillText(`最終分數：${score}　最終持有金幣：${gameCoins}`, W / 2, 425);
        ctx.fillText(`總花費時間：${formatTime(finalElapsedTime)}`, W / 2, 465);
        ctx.font = '22px "Microsoft JhengHei"';
        ctx.fillText('按下方「重新開始」可再次挑戰', W / 2, 595);
        ctx.restore();
        return;
      }

      ctx.fillStyle = 'rgba(10,16,8,0.52)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.94)';
      ctx.fillRect(260, 255, 760, 230);
      ctx.strokeStyle = '#78c952';
      ctx.lineWidth = 5;
      ctx.strokeRect(260, 255, 760, 230);
      ctx.fillStyle = '#24431a';
      ctx.textAlign = 'center';
      ctx.font = 'bold 40px "Microsoft JhengHei"';
      ctx.fillText(finished ? '遊戲結束' : '跳跳跳健康問答', W / 2, 330);
      ctx.font = '24px "Microsoft JhengHei"';
      ctx.fillText(finished ? `最終分數：${score}` : '碰撞正確答案，消除箱子並跳上下一層', W / 2, 378);
      ctx.fillText(finished ? `總花費時間：${formatTime(finalElapsedTime)}` : '按上方「開始遊戲」開始', W / 2, 420);
      if (finished) ctx.fillText('按重新開始可再次挑戰', W / 2, 455);
      ctx.restore();
    }

    function draw() {
      drawBackground();
      drawVersionLabel();
      drawQuestion();
      drawUpperPlatform();
      drawBrickLineExceptGate();
      answerBoxes().forEach(drawAnswerBox);
      drawUpperPlatform();
      drawCoin();
      drawParticles();
      drawTrailParticles(); 
      drawHazards();
      drawGroundPlatform();
      if (running) drawPlayer();
      drawPopup();
      drawOverlay();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (['ArrowUp', ' ', 'w', 'W'].includes(e.key)) {
        e.preventDefault();
        jump();
      }
    });
    document.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    selectJayBtn.addEventListener('click', () => selectCharacter('jay'));
    selectNanaBtn.addEventListener('click', () => selectCharacter('nana'));

    musicBtn.addEventListener('click', () => {
      musicEnabled = !musicEnabled;
      updateMusicButton();
      if (musicEnabled) {
        startBackgroundMusic();
      } else {
        stopBackgroundMusic();
      }
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
    winRestartBtn.addEventListener('click', startGame);

    updateMusicButton();
    updateHud();
    loop();
  </script>
</body>
</html>
